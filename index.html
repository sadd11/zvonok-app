<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скачать APK</title>
<link rel="icon" href="zvonok-icon-192.png">
<style>
:root{--s:#FEF7FF;--os:#1D1B20;--osv:#49454F;--sc:#F3EDF7;--sch:#ECE6F0;--p:#6750A4;--op:#FFF;--pc:#EADDFF;--opc:#21005D;--ov:#CAC4D0;--spring:cubic-bezier(.42,1.67,.21,.9);--eff:cubic-bezier(.34,.8,.34,1)}
@media (prefers-color-scheme:dark){:root{--s:#141218;--os:#E6E0E9;--osv:#CAC4D0;--sc:#211F26;--sch:#2B2930;--p:#D0BCFF;--op:#381E72;--pc:#4F378B;--opc:#EADDFF;--ov:#49454F}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--s);color:var(--os);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px}
.hero{background:var(--pc);color:var(--opc);border-radius:48px;padding:32px 24px;text-align:center}
.hero img{width:96px;height:96px;border-radius:26px;display:block;margin:0 auto 16px}
h1{font:400 32px/40px Roboto,system-ui,sans-serif;margin:0}
.desc{font:400 16px/24px Roboto,system-ui,sans-serif;margin:8px 0 24px;opacity:.85}
.dl{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 32px;border-radius:28px;background:var(--p);color:var(--op);font:500 16px/24px Roboto,system-ui,sans-serif;text-decoration:none;transition:border-radius 350ms var(--spring),transform 350ms var(--spring)}
.dl:active{border-radius:16px;transform:scale(.97)}
.dl[aria-disabled=true]{opacity:.5;pointer-events:none}
.meta{font:400 14px/20px Roboto,system-ui,sans-serif;margin-top:16px;opacity:.85}
.card{background:var(--sc);border-radius:28px;padding:20px 24px;margin-top:8px}
.card h2{font:500 16px/24px Roboto,system-ui,sans-serif;margin:0 0 8px}
.card p,.card li{font:400 14px/20px Roboto,system-ui,sans-serif;color:var(--osv);margin:0}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
#notes{white-space:pre-wrap;word-break:break-word}
.link{display:block;text-align:center;margin-top:16px;color:var(--p);font:500 14px/20px Roboto,system-ui,sans-serif;text-decoration:none;padding:10px}
</style>
</head>
<body>
<main>
<div class="hero">
<img src="zvonok-icon-512.png" alt="" onerror="this.style.display='none'">
<h1 id="name">…</h1>
<p class="desc" id="desc"></p>
<a class="dl" id="dl" href="#" aria-disabled="true">Загрузка…</a>
<div class="meta" id="meta"></div>
</div>
<div class="card" id="notesCard" hidden><h2>Что нового</h2><p id="notes"></p></div>
<div class="card"><h2>Как установить</h2>
<ol><li>Скачай файл и открой его на телефоне.</li>
<li>Если Android попросит, разреши установку из этого источника.</li>
<li>Нажми «Установить».</li></ol></div>
<a class="link" id="all" href="#">Все версии</a>
</main>
<script>
/* ===== НАСТРОЙКИ: впиши свои данные ===== */
const CFG={
  appName:"До звонка",                 // название приложения
  description:"Сколько осталось до звонка на урок и с урока.",
  owner:"sadd11",           // имя пользователя на GitHub
  repo:"zvonok-app",              // название репозитория с релизами
  apkName:"",                          // необязательно: точное имя файла, например "app-release.apk" (запасная ссылка, если GitHub API недоступен)
  token:"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"                             // ТОЛЬКО для приватного репозитория: токен GitHub (см. предупреждение в ответе). Для публичного оставь пустым
};
/* ======================================== */
const $=id=>document.getElementById(id);
const rel=`https://github.com/${CFG.owner}/${CFG.repo}/releases`;
document.title="Скачать "+CFG.appName;
$("name").textContent=CFG.appName;
$("desc").textContent=CFG.description;
$("all").href=rel;
if(CFG.token)$("all").hidden=true;
async function dlAsset(a){
  const b=$("dl"),t=b.textContent;
  b.setAttribute("aria-disabled","true");b.textContent="Скачивание…";
  try{
    const r=await fetch(a.url,{headers:{Accept:"application/octet-stream",Authorization:"Bearer "+CFG.token}});
    if(!r.ok)throw r.status;
    const u=URL.createObjectURL(await r.blob());
    const l=document.createElement("a");l.href=u;l.download=a.name;document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
    b.textContent=t;
  }catch(e){b.textContent="Ошибка скачивания, попробуй ещё раз"}
  b.removeAttribute("aria-disabled");
}
function fail(msg){
  const b=$("dl");
  if(CFG.token){b.textContent="Недоступно";$("meta").textContent=msg;return}
  if(CFG.apkName){b.href=`${rel}/latest/download/${CFG.apkName}`;b.textContent="Скачать APK";b.removeAttribute("aria-disabled")}
  else{b.href=rel+"/latest";b.textContent="Открыть релизы на GitHub";b.removeAttribute("aria-disabled")}
  $("meta").textContent=msg;
}
const mb=n=>(n/1048576).toFixed(1).replace(".",",")+" МБ";
const H={Accept:"application/vnd.github+json"};
if(CFG.token)H.Authorization="Bearer "+CFG.token;
fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/releases/latest`,{headers:H})
.then(r=>{if(!r.ok)throw r.status;return r.json()})
.then(j=>{
  const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
  if(!a){fail("В последнем релизе нет APK-файла");return}
  const b=$("dl");b.textContent="Скачать APK";b.removeAttribute("aria-disabled");
  if(CFG.token){b.href="#";b.onclick=e=>{e.preventDefault();dlAsset(a)}}
  else{b.href=a.browser_download_url;b.setAttribute("download",a.name)}
  const d=new Date(j.published_at).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
  $("meta").textContent=`Версия ${j.tag_name||j.name} · ${mb(a.size)} · ${d}`;
  if(j.body&&j.body.trim()){$("notes").textContent=j.body.trim();$("notesCard").hidden=false}
})
.catch(()=>fail("Не удалось получить данные о версии"));
</script>
</body>
</html>
